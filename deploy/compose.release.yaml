name: analytics-admin-release

x-runtime: &runtime
  env_file:
    - ${RUNTIME_ENV_FILE:-.env.runtime}
  init: true
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 20s
  tmpfs:
    - /tmp:mode=1777

services:
  migrations:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/migrations:${IMAGE_TAG:?Set IMAGE_TAG}
    env_file:
      - ${RUNTIME_ENV_FILE:-.env.runtime}
      - ${MIGRATION_ENV_FILE:-.env.migration}
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    profiles: [migration]

  api:
    <<: *runtime
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/api:${IMAGE_TAG:?Set IMAGE_TAG}
    expose:
      - 3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *runtime
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/worker:${IMAGE_TAG:?Set IMAGE_TAG}

  web:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/web:${IMAGE_TAG:?Set IMAGE_TAG}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_PORT:-8080}:8080
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /tmp/nginx:uid=101,gid=101,mode=0700
