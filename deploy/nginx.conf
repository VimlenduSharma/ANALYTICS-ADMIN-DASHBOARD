pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 10m;

  client_body_temp_path /tmp/nginx/client_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  upstream analytics_api {
    server api:3000;
    keepalive 16;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
      access_log off;
      return 204;
    }

    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://analytics_api;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;
    }

    location ~* "^/.*-[a-z0-9]{8,}\.(?:css|js)$" {
      try_files $uri =404;
      expires 1y;
    }

    location ~* \.(?:css|ico|js|svg)$ {
      try_files $uri =404;
      expires 1h;
    }

    location = / {
      try_files /index.html =404;
    }

    location ~ "^/(?:sign-in|access-denied|profile|workspace/components|organizations/[0-9a-fA-F-]{36}/(?:sales|operations|team|governance|accept-invitation))/?$" {
      try_files $uri /index.html;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
    location = /index.html {
      internal;
      expires -1;
    }
  }
}
